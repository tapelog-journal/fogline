<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fogline widget · local host harness</title>
<style>
body{margin:0;background:#212121;color:#ececec;font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.bar{font-size:12px;color:#9a9a9a;margin-bottom:14px}
.user{background:#303030;border-radius:18px;padding:10px 16px;margin:0 0 16px auto;max-width:70%;width:fit-content}
.tool{font-size:13px;color:#b4b4b4;margin:6px 0}
iframe{width:100%;border:0;display:block;height:980px;border-radius:14px}
.reply{margin-top:10px}
#log{font:11px/1.35 ui-monospace,monospace;color:#8a8a8a;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:14px;border-top:1px solid #333;padding-top:8px}
</style></head><body><div class="wrap">
<div class="bar">Local test harness emulating an MCP Apps host (ChatGPT-style). Widget and tools come from the real Fogline MCP server.</div>
<div class="user" id="prompt">Let's play Fogline against the TapeLog bot.</div>
<div class="tool" id="toolline">Calling Fogline…</div>
<iframe id="w" sandbox="allow-scripts allow-popups" title="Fogline board"></iframe>
<div class="reply" id="reply"></div>
<div id="log"></div>
</div>
<script>
const q = new URLSearchParams(location.search), MODE = q.get("mode") || "bridge";
const log = (...a) => { const el = document.getElementById("log"); el.textContent += a.map((x) => typeof x === "string" ? x : JSON.stringify(x).slice(0, 300)).join(" ") + "\n"; el.scrollTop = 1e9; };
let rid = 1;
async function mcp(method, params) {
  const r = await fetch("/mcp-proxy", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: rid++, method, params }) });
  const t = await r.text(); const j = JSON.parse(t.startsWith("event:") || t.startsWith("data:") ? t.split("\n").find((l) => l.startsWith("data:")).slice(5) : t);
  if (j.error) throw new Error(j.error.message); return j.result;
}
window.__harness = { calls: [], modelContext: [] };
(async () => {
  try {
    const tools = (await mcp("tools/list", {})).tools;
    const st = tools.find((t) => t.name === "fogline_state"), mv = tools.find((t) => t.name === "fogline_move");
    const uri = st._meta?.ui?.resourceUri || st._meta?.["openai/outputTemplate"];
    log("fogline_state _meta:", st._meta, "fogline_move _meta:", mv._meta);
    const rr = await mcp("resources/read", { uri });
    const res = rr.contents[0]; log("resource", res.uri, res.mimeType, (res.text || "").length + " chars", res._meta);
    window.__harness.resource = { uri: res.uri, mimeType: res.mimeType, meta: res._meta };
    let session = q.get("session"), matchId = Number(q.get("matchId") || 0), tool = q.get("tool") || "fogline_state";
    if (q.get("new")) {
      if (!session) { const np = await mcp("tools/call", { name: "fogline_new_player", arguments: {} }); session = np.content[0].text.match(/fl_[0-9a-f]{32}/)[0]; log("new player", session); }
      const pb = await mcp("tools/call", { name: "fogline_play_bot", arguments: { session } }); matchId = Number(pb.structuredContent.matchId); log("match", matchId);
      tool = "fogline_auto_army";
    }
    window.__harness.session = session; window.__harness.matchId = matchId;
    const args = { session, matchId };
    document.getElementById("toolline").textContent = `Called Fogline · ${tool}`;
    let html = res.text;
    let toolResult = null;
    const frame = document.getElementById("w");
    if (MODE === "openai") {
      toolResult = await mcp("tools/call", { name: tool, arguments: args });
      const shim = `<script>window.openai={toolInput:${JSON.stringify(args)},toolOutput:${JSON.stringify(toolResult.structuredContent)},toolResponseMetadata:${JSON.stringify(toolResult._meta||{})},widgetState:null,setWidgetState(s){parent.postMessage({__oa:"state",s},"*")},openExternal(o){parent.postMessage({__oa:"open",o},"*")},callTool(name,args){return new Promise((ok,ko)=>{const id=Math.random();addEventListener("message",function h(e){if(e.data&&e.data.__oaRes===id){removeEventListener("message",h);e.data.err?ko(new Error(e.data.err)):ok(e.data.res)}});parent.postMessage({__oa:"call",id,name,args},"*")})}};<\/script>`;
      html = shim + html;
    }
    window.addEventListener("message", async (ev) => {
      if (ev.source !== frame.contentWindow) return;
      const m = ev.data;
      if (m && m.__oa) {
        if (m.__oa === "call") { window.__harness.calls.push(m.name); log("openai.callTool", m.name, m.args); try { const r = await mcp("tools/call", { name: m.name, arguments: m.args }); frame.contentWindow.postMessage({ __oaRes: m.id, res: r }, "*"); } catch (e) { frame.contentWindow.postMessage({ __oaRes: m.id, err: String(e) }, "*"); } }
        else log("openai", m.__oa, m.s || m.o);
        if (m.__oa === "state") window.__harness.modelContext.push(m.s && m.s.modelContent);
        return;
      }
      if (!m || m.jsonrpc !== "2.0") return;
      const reply = (result) => frame.contentWindow.postMessage({ jsonrpc: "2.0", id: m.id, result }, "*");
      const fail = (message) => frame.contentWindow.postMessage({ jsonrpc: "2.0", id: m.id, error: { code: -32000, message } }, "*");
      log("<- view", m.method, m.params);
      if (MODE === "openai" && m.method === "ui/initialize") return; // emulate a host without the MCP Apps bridge
      switch (m.method) {
        case "ui/initialize":
          reply({ protocolVersion: "2026-01-26", hostInfo: { name: "fogline-local-harness", version: "1" }, hostCapabilities: { openLinks: {}, serverTools: {}, updateModelContext: { text: {} } }, hostContext: { theme: "dark", displayMode: "inline", availableDisplayModes: ["inline", "fullscreen"] } });
          break;
        case "ui/notifications/initialized":
          frame.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: args } }, "*");
          toolResult = await mcp("tools/call", { name: tool, arguments: args });
          log("tool result", tool, toolResult.structuredContent && { phase: toolResult.structuredContent.phase, ply: toolResult.structuredContent.ply, moves: toolResult.structuredContent.legalMoves.length }, "meta keys", Object.keys(toolResult._meta || {}));
          window.__harness.firstResult = { sc: toolResult.structuredContent, metaKeys: Object.keys(toolResult._meta || {}) };
          frame.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: toolResult }, "*");
          document.getElementById("reply").textContent = "Your army is placed and the board is ready. Tap a piece, then a highlighted square to move.";
          break;
        case "tools/call":
          window.__harness.calls.push(m.params.name);
          try { reply(await mcp("tools/call", m.params)); } catch (e) { fail(String(e)); }
          break;
        case "ui/update-model-context": window.__harness.modelContext.push(m.params); reply({}); break;
        case "ui/open-link": log("open-link", m.params.url); reply({}); break;
        case "ui/request-display-mode": reply({ mode: "inline" }); break;
        case "ui/notifications/size-changed": break;
        default: if (m.id !== undefined) fail("unsupported " + m.method);
      }
    });
    frame.srcdoc = html;
  } catch (e) { log("HARNESS ERROR", String(e)); window.__harness.error = String(e); }
})();
</script></body></html>
